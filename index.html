<title>VESTIQ – Your Style. Your Identity.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#000;--card:#121110;--line:#2a261d;--gold:#c9a24b;--gold2:#e8cf8e;--ink:#f6f2ea;--mute:#9b9484;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-size:15px}
.app{max-width:520px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
.brand{text-align:center;padding:28px 0 18px;border-bottom:1px solid var(--line)}
.brand h1{font-size:40px;letter-spacing:.28em;color:var(--gold2);padding-left:.28em}
.brand p{margin:4px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--mute)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#000;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;background:none;border:0;color:var(--mute);padding:14px 4px;font:500 14px Jost,sans-serif;border-top:2px solid transparent;cursor:pointer}
.nav button.on{color:var(--gold2);border-top-color:var(--gold)}
.sec{margin-top:22px}
.sec h2{font-size:28px;color:var(--ink);margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 14px;line-height:1.5}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input[type=text],input[type=number],select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:6px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:500}
.tones{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tone{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.tone.on{border-color:var(--gold2);box-shadow:0 0 0 3px #000,0 0 0 4px var(--gold)}
.btn{width:100%;margin-top:20px;background:var(--gold);color:#000;border:0;padding:15px;border-radius:6px;font:500 16px Jost,sans-serif;cursor:pointer}
.btn.ghost{background:none;color:var(--gold2);border:1px solid var(--gold)}
.pal{display:flex;gap:8px;margin-top:6px}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid #fff3}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:16px;overflow:hidden}
.hd{padding:16px 16px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hd h3{font-size:23px}
.meta{color:var(--mute);font-size:13px;margin-top:3px}
.match{border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
.look{height:6px;display:flex}
.item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.sw{width:38px;height:38px;border-radius:6px;flex:none;border:1px solid #fff2}
.item .n{flex:1;min-width:0}
.item .n b{display:block;font-weight:500}
.item .n span{color:var(--mute);font-size:12px}
.price{color:var(--gold2);font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
.shop{color:var(--gold2);border:1px solid var(--gold);border-radius:6px;padding:7px 11px;font-size:13px;text-decoration:none}
.ft{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--gold)}
.ft .tot{font:600 24px 'Cormorant Garamond',serif}
.heart{background:none;border:1px solid var(--gold);color:var(--gold2);padding:9px 14px;border-radius:6px;font:inherit;cursor:pointer}
.heart.on{background:var(--gold);color:#000}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tabs .chip{flex:none}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:1px dashed var(--line);border-radius:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 18px;border-radius:999px;z-index:30;font-weight:500}
input[type=range]{width:100%;accent-color:var(--gold)}
.big{font:600 30px 'Cormorant Garamond',serif;color:var(--gold2)}
.art{position:relative;border-bottom:1px solid var(--line)}
.art svg,.art img{width:100%;height:300px;display:block;object-fit:cover}
.cap{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--mute)}
.phb{position:absolute;right:10px;bottom:8px;display:inline-block;margin:0;background:#000c;border:1px solid var(--gold);color:var(--gold2);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer}
button.shop{background:none;cursor:pointer;font:inherit;font-size:13px}
.panel{padding:12px 16px 16px;border-top:1px solid var(--line);background:#0b0a09}
.shops{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.why{padding:0 16px 12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.tag{font-size:11px;border:1px solid var(--gold);border-radius:4px;padding:1px 6px;color:var(--gold2);margin-left:6px;font-weight:400}
.note{color:var(--mute);font-size:12px;line-height:1.5;margin:10px 0 0}
.match{padding:4px 10px;font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 16px}
.ft{flex-wrap:wrap;gap:10px}
@media(min-width:720px){.app{max-width:980px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav div{max-width:980px}.brand h1{font-size:48px}}
@media(max-width:380px){.row3{grid-template-columns:1fr 1fr}.brand h1{font-size:30px;letter-spacing:.2em}.item{flex-wrap:wrap}.tones{gap:6px}}
.th{width:68px;height:68px;aspect-ratio:1/1;flex:none;border-radius:8px;background:#0d0c0a;border:1px solid var(--line);display:block}
img.th{object-fit:cover}svg.th{padding:5px}
.upl{display:inline-block;margin:10px 0 0;border:1px solid var(--gold);color:var(--gold2);padding:8px 12px;border-radius:6px;cursor:pointer;font:13px Jost,sans-serif}
@media(min-width:720px){.th{width:84px;height:84px}}
@media(max-width:380px){.th{width:56px;height:56px}}
.lbw{position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lb{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.lb::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:3/4;max-height:560px;background:#0a0908}
.slide img,.fg,.fg svg{width:100%;height:100%;display:block;object-fit:cover}
.thumbs{display:flex;gap:8px;padding:10px 16px}
.thb{width:64px;aspect-ratio:3/4;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0a0908;cursor:pointer}.thb.on{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.tr{background:none;border:1px solid var(--line);color:var(--ink);padding:10px 4px;border-radius:8px;font:13px Jost,sans-serif;cursor:pointer;display:flex;flex-direction:column;gap:2px}.tr b{font:600 18px 'Cormorant Garamond',serif;color:var(--gold2)}.tr.on{border-color:var(--gold);background:#1a160c}
.pg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 16px 16px}
.pc{background:#0b0a09;border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.pc .th{width:100%;height:auto;aspect-ratio:1/1}.pn{display:block;font-weight:500;margin-top:8px;font-size:14px}
.alt{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:8px;margin-top:8px;font:14px Jost,sans-serif;cursor:pointer}
@media(min-width:720px){.pg{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="root"><div class="app"><div class="brand"><h1>VESTIQ</h1><p>Your Style. Your Identity.</p></div><p class="sub" style="text-align:center;margin-top:24px">Loading your stylist...</p></div></div>
<script>window.onerror=function(m,u,l){var r=document.getElementById("root");if(r&&!window.__ok){r.insertAdjacentHTML("beforeend","<p class=sub style=\"padding:16px;color:#e8cf8e\">Something went wrong: "+String(m)+" (line "+l+"). Please reload.</p>")}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const TPL=(function(){
 const RE=/\u0001(\d+)\u0002/, REG=/\u0001(\d+)\u0002/g, cache=new WeakMap();
 const css=s=>{const o={};String(s).split(';').forEach(p=>{const i=p.indexOf(':');if(i>0)o[p.slice(0,i).trim().replace(/-(\w)/g,(_,c)=>c.toUpperCase())]=p.slice(i+1).trim()});return o};
 function parse(src){
  let i=0;const root={c:[]},st=[root];
  const top=()=>st[st.length-1];
  const text=t=>{
   if(t.indexOf('\n')>=0)t=t.replace(/^\s*\n\s*|\s*\n\s*$/g,'').replace(/\s*\n\s*/g,' ');
   if(!t)return;
   let last=0,m;REG.lastIndex=0;
   while((m=REG.exec(t))){if(m.index>last)top().c.push({s:t.slice(last,m.index)});top().c.push({v:+m[1]});last=REG.lastIndex}
   if(last<t.length)top().c.push({s:t.slice(last)});
  };
  while(i<src.length){
   const lt=src.indexOf('<',i);
   if(lt<0){text(src.slice(i));break}
   if(lt>i)text(src.slice(i,lt));
   i=lt;
   if(src[i+1]==='/'){i=src.indexOf('>',i)+1;st.pop();continue}
   i++;let s=i;
   while(i<src.length&&!/[\s\/>]/.test(src[i]))i++;
   const nm=src.slice(s,i),m=RE.exec(nm);
   const node={t:m&&m[0]===nm?{v:+m[1]}:nm,a:[],c:[]};
   let self=false;
   for(;;){
    while(/\s/.test(src[i]))i++;
    if(src[i]==='/'&&src[i+1]==='>'){self=true;i+=2;break}
    if(src[i]==='>'){i++;break}
    s=i;while(i<src.length&&!/[\s=\/>]/.test(src[i]))i++;
    const k=src.slice(s,i);let v=true;
    if(src[i]==='='){
     i++;
     if(src[i]==='"'||src[i]==="'"){const q=src[i];const e=src.indexOf(q,i+1);v={s:src.slice(i+1,e)};i=e+1}
     else{s=i;while(i<src.length&&!/[\s>]/.test(src[i])&&!(src[i]==='/'&&src[i+1]==='>'))i++;v={s:src.slice(s,i)}}
    }
    node.a.push([k,v]);
   }
   top().c.push(node);
   if(!self)st.push(node);
  }
  return root.c;
 }
 function build(n,vals,h){
  if(n.v!==undefined)return vals[n.v];
  if(n.s!==undefined)return n.s;
  const res=x=>{if(x===true)return true;const s=x.s,m=RE.exec(s);return m&&m[0]===s?vals[+m[1]]:s.replace(REG,(_,k)=>vals[+k])};
  const props={};
  n.a.forEach(([k,x])=>{let v=res(x);if(k==='class')k='className';else if(k==='for')k='htmlFor';else if(k==='style'&&typeof v==='string')v=css(v);props[k]=v});
  const type=typeof n.t==='object'?vals[n.t.v]:n.t;
  return h(type,props,...n.c.map(c=>build(c,vals,h)));
 }
 return function(h){return function(strings,...vals){
  let ast=cache.get(strings);
  if(!ast){ast=parse(strings.reduce((a,s,i)=>a+(i?'\u0001'+(i-1)+'\u0002':'')+s,''));cache.set(strings,ast)}
  const out=ast.map(n=>build(n,vals,h));
  return out.length===1?out[0]:out;
 }}
})();

const html=TPL(React.createElement);

const HEX={black:'#111',white:'#f4f1ea',navy:'#1c2a4a',burgundy:'#6d1f2f',emerald:'#0f6b4f',blush:'#e8b9b0',camel:'#b88a55',olive:'#6b6b2e',red:'#b3262e',gold:'#c9a24b',grey:'#8a8a8a',blue:'#4a76b0',cream:'#efe3c8',plum:'#5b2a56',tan:'#c9a67a'};
const TONES=[
 {n:'Porcelain',c:'#f6dfd0',rec:['navy','burgundy','emerald','blush','plum']},
 {n:'Ivory',c:'#ecc9a9',rec:['olive','camel','navy','cream','emerald']},
 {n:'Sand',c:'#d9a678',rec:['olive','red','cream','blue','camel']},
 {n:'Honey',c:'#b97f4f',rec:['emerald','burgundy','gold','cream','white']},
 {n:'Caramel',c:'#8d5a35',rec:['white','red','gold','blue','emerald']},
 {n:'Espresso',c:'#5a3722',rec:['white','gold','cream','red','blush']}
];
const CATS=['Casual','Party','Formal','Wedding'];
const SEAS=['Spring','Summer','Autumn','Winter'];
const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};

function Chips({opts,val,on,multi}){
 return html`<div class="chips">${opts.map(o=>{const sel=multi?val.includes(o):val===o;return html`<button key=${o} class=${'chip'+(sel?' on':'')} onClick=${()=>on(o)}>${o}</button>`})}</div>`;
}

function Profile({p,setP,go,toast}){
 const [d,setD]=useState(p);
 const set=(k,v)=>setD({...d,[k]:v});
 const tog=c=>set('colors',d.colors.includes(c)?d.colors.filter(x=>x!==c):[...d.colors,c]);
 const bmi=d.h&&d.w?(d.w/Math.pow(d.h/100,2)).toFixed(1):null;
 const ok=d.name.trim()&&d.h>0&&d.w>0;
 const save=()=>{if(!ok){toast('Add your name, height and weight first');return}setP(d);toast('Profile saved');go('Outfits')};
 const tone=TONES[d.tone];
 return html`<div class="sec"><h2>Your profile</h2><p class="sub">Tell us about you and we will match outfits to your colouring and budget.</p>
 <label>Name</label><input type="text" value=${d.name} placeholder="e.g. Aria" onInput=${e=>set('name',e.target.value)}/>
 <label>I shop for</label><${Chips} opts=${['Women','Men','All']} val=${d.fit} on=${v=>set('fit',v)}/>
 <div class="row"><div><label>Height (cm)</label><input type="number" value=${d.h} onInput=${e=>set('h',+e.target.value)}/></div><div><label>Weight (kg)</label><input type="number" value=${d.w} onInput=${e=>set('w',+e.target.value)}/></div></div>
 <div class="row3"><div><label>Chest (cm)</label><input type="number" value=${d.chest} onInput=${e=>set('chest',+e.target.value)}/></div><div><label>Waist (cm)</label><input type="number" value=${d.waist} onInput=${e=>set('waist',+e.target.value)}/></div><div><label>Hip (cm)</label><input type="number" value=${d.hip} onInput=${e=>set('hip',+e.target.value)}/></div></div>
 <label>Usual size</label><${Chips} opts=${['XS','S','M','L','XL','XXL']} val=${d.size} on=${v=>set('size',v)}/>
 ${bmi&&html`<p class="sub" style="margin-top:12px">Body mass index ${bmi}. Sizes are a starting point; check each brand's chart.</p>`}
 <label>Preferred fit</label><${Chips} opts=${['Slim','Regular','Relaxed']} val=${d.fitp} on=${v=>set('fitp',v)}/>
 <label>Skin tone: ${tone.n}</label>
 <div class="tones">${TONES.map((t,i)=>html`<button key=${i} aria-label=${t.n} class=${'tone'+(d.tone===i?' on':'')} style=${{background:t.c}} onClick=${()=>set('tone',i)}></button>`)}</div>
 <label>Undertone</label><${Chips} opts=${['Cool','Neutral','Warm']} val=${d.under} on=${v=>set('under',v)}/>
 <label>Your best colours</label>
 <div class="pal">${tone.rec.map(c=>html`<span key=${c} class="dot" title=${c} style=${{background:HEX[c]}}></span>`)}</div>
 <label>Colours you love (tap to pick)</label>
 <div class="chips">${Object.keys(HEX).map(c=>html`<button key=${c} class=${'chip'+(d.colors.includes(c)?' on':'')} onClick=${()=>tog(c)}><span class="dot" style=${{background:HEX[c],display:'inline-block',width:12,height:12,marginRight:6,verticalAlign:'middle'}}></span>${c}</button>`)}</div>
 <button class="btn" onClick=${save}>Save profile and see outfits</button></div>`;
}

const SHOPS=[['Amazon.in',s=>'https://www.amazon.in/s?k='+s],['Flipkart',s=>'https://www.flipkart.com/search?q='+s],['Ajio',s=>'https://www.ajio.com/search/?text='+s],['Google Shopping',s=>'https://www.google.com/search?tbm=shop&gl=in&q='+s]];
const BRANDS=['Fabindia','Biba','W','Raymond','Allen Solly','Peter England','Van Heusen','Manyavar','Libas','Levi\'s','Puma','Bata'];
const VERIFIED={}; /* key "outfitId-itemIndex": {brand,url,price,sizes}. Empty until product data is checked. */
const okUrl=u=>{try{return new URL(u).protocol==='https:'}catch(e){return false}};

const KINDS=[['watch',/watch/],['glasses',/sunglass/],['belt',/belt/],['tie',/\btie\b/],['scarf',/scarf|stole|shawl/],['beanie',/beanie/],['pocket',/pocket square/],['jewel',/earring|necklace|jhumka/],['clutch',/clutch|potli/],['bag',/bag|tote/],['heel',/heel|pump|sandal|jutti|mojari/],['boot',/boot/],['shoe',/shoe|sneaker|loafer/],['shorts',/short/],['jeans',/jean|trouser|chino|churidar/],['blazer',/blazer|suit|jacket|coat|sherwani/],['dress',/dress|gown|saree|slip|kurta/],['shirt',/shirt|blouse|shell/],['tee',/tee|knit|turtleneck|crew/]];
const circ=(x,y,r)=>`M${x} ${y} m-${r} 0 a${r} ${r} 0 1 0 ${r*2} 0 a${r} ${r} 0 1 0 -${r*2} 0`;
const TEE='M30 18 L43 14 Q50 22 57 14 L70 18 L87 36 L76 46 L68 40 L68 86 L32 86 L32 40 L24 46 L13 36 Z';
const SH={
 tee:[[TEE,'c'],['M43 14 Q50 25 57 14','n']],
 shirt:[[TEE,'c'],['M43 14 L36 24 L50 30 L64 24 L57 14 M50 30 V86','n']],
 jeans:[['M30 10 H70 L74 90 H54 L50 36 L46 90 H26 Z','c'],['M30 18 H70 M50 36 V18 M35 22 Q39 30 42 32','n']],
 shorts:[['M28 18 H72 L78 62 H54 L50 40 L46 62 H22 Z','c'],['M28 26 H72 M50 40 V26','n']],
 dress:[['M40 8 H60 L58 34 L76 92 H24 L42 34 Z','c'],['M40 8 Q50 20 60 8 M42 34 H58','n']],
 blazer:[['M26 14 L42 10 L50 24 L58 10 L74 14 L90 40 L79 50 L74 42 L74 90 L26 90 L26 42 L21 50 L10 40 Z','c'],['M42 10 L50 50 L58 10 M50 50 V90 M42 10 L36 30 L50 50 M58 10 L64 30 L50 50','n'],[circ(54,64,2.4),'g'],[circ(54,78,2.4),'g']],
 shoe:[['M8 60 V46 Q28 44 36 30 L48 40 Q66 46 92 58 V68 H8 Z','c'],['M8 68 H92 V75 H8 Z','d'],['M38 36 L44 43 M45 32 L51 41','n']],
 boot:[['M30 10 H52 V44 Q74 48 90 60 V70 H22 L26 44 Z','c'],['M22 70 H90 V77 H22 Z','d']],
 heel:[['M12 40 L28 34 Q36 58 62 62 L92 68 V76 L60 74 L56 92 H50 L52 72 Q28 70 12 56 Z','c']],
 watch:[['M38 4 H62 L64 30 H36 Z','c'],['M36 70 H64 L62 96 H38 Z','c'],[circ(50,50,22),'g'],[circ(50,50,17),'d'],['M50 50 V37 M50 50 L60 56','h']],
